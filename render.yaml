services:
  - type: web
    name: reachinbox-scheduler
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: SEND_DELAY_MS
        value: "500"
      - key: MAX_EMAILS_PER_HOUR
        value: "100"
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: reachinbox-postgres
    plan: free
    region: oregon
    databaseName: reachinbox
    user: postgres

  - name: reachinbox-redis
    plan: free
    region: oregon
    ipAllowList: []
